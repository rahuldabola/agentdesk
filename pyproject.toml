[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentdesk"
version = "1.0.0"
description = "Multi-agent research orchestrator: LangGraph + MCP + RAG, with a self-correcting Critic/Writer loop"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "google-genai>=1.0,<2.0",
    "langgraph>=0.2,<2.0",
    "chromadb>=1.0,<2.0",
    "mcp>=2.0,<3.0",
    "requests>=2.32,<3.0",
    "beautifulsoup4>=4.12,<5.0",
    "python-dotenv>=1.0,<2.0",
    "pydantic>=2.8,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<8.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.6,<1.0",
]

[project.scripts]
agentdesk-ingest = "app.rag.ingest:__main__"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/mcp/server.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET"]
ignore = [
    "B008",    # FastAPI dependency injection uses calls in defaults
    "SIM108",  # a ternary is not always clearer than an if/else
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"eval/*" = ["E402"]
"scripts/*" = ["E402"]
