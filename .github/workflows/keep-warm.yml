# Render's free tier sleeps after 15 idle minutes, and a cold start (boot + re-ingest)
# takes about a minute, which is a bad first impression for a live demo.
# Set the SERVICE_URL repository variable to the deployed API URL to enable.
name: Keep warm

on:
  # Awake 8 PM-8 AM IST only (14:30-02:30 UTC): 12 h/day per service, so this and the other
  # free Render service on the account (~720 h together) stay under Render's 750 free hours/month.
  # Outside this window the instance sleeps after 15 idle minutes and wakes on the next request.
  schedule:
    - cron: "30-59/10 14 * * *"
    - cron: "*/10 15-23,0-1 * * *"
    - cron: "0-30/10 2 * * *"
  workflow_dispatch:

jobs:
  ping:
    if: vars.SERVICE_URL != ''
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 90 "${{ vars.SERVICE_URL }}/health" || true
