name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - name: Lint
        run: ruff check .
      - name: Formatting check
        run: ruff format --check --diff .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -r requirements.txt

      - name: Test suite
        run: pytest -v --cov=app --cov-report=term-missing --cov-fail-under=85

      # A mocked suite cannot catch import-time or startup breakage.
      - name: API boot smoke test
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          server_pid=$!
          trap "kill $server_pid 2>/dev/null || true" EXIT
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health; then
              echo "server healthy"
              exit 0
            fi
            sleep 0.5
          done
          echo "server did not become healthy in time"
          exit 1

      # The MCP tool server is a separate process; prove it starts and speaks
      # the protocol, which the in-memory transport tests deliberately bypass.
      - name: MCP stdio server smoke test
        run: python -m scripts.check_mcp_server

  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # Deterministic, stubbed end-to-end run. Fails the build if a pipeline
      # invariant regresses (every case completes, every citation resolves).
      - name: Offline evaluation
        run: python -m eval.run_eval --offline --check

      # The cross-encoder is ~90MB from the Hugging Face Hub; cache it between runs.
      - uses: actions/cache@v4
        with:
          path: /tmp/fastembed_cache
          key: fastembed-${{ hashFiles('app/config.py') }}

      # Retrieval benchmark over 64 labelled questions, replaying the checked-in
      # Gemini embeddings (no API key needed). Fails if retrieval quality or the
      # relevance floor regresses below the thresholds in the script.
      - name: Retrieval benchmark
        run: python -m eval.run_retrieval_eval --check
